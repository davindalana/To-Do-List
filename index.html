<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A simple to do list app to manage your daily tasks." />
    <title>To Do List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="app">
      <h1>To Do</h1>

      <section class="input-section" aria-label="Add a task">
        <input
          id="task-input"
          type="text"
          placeholder="What needs to be done?"
          aria-label="New task description"
          maxlength="500"
          autocomplete="off"
        />
        <button id="add-btn" type="button">Add</button>
      </section>

      <section class="task-section" aria-label="Task list">
        <ul id="task-list" role="list" aria-label="Tasks" aria-live="polite"></ul>
        <p id="empty-state" role="status" aria-live="polite">
          Nothing to do. Add a task above.
        </p>
      </section>

      <footer class="filter-section" role="navigation" aria-label="Filter tasks">
        <button class="filter-btn" type="button" data-filter="all">All</button>
        <button class="filter-btn" type="button" data-filter="active">Active</button>
        <button class="filter-btn" type="button" data-filter="completed">Completed</button>
      </footer>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
